<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#103b50">
    <meta name="description" content="A secure mobile inbox for care-team alerts.">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./app.css">
    <title>Care alerts</title>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">+</span>
          <div>
            <p class="eyebrow">CARE TEAM</p>
            <h1>Alert inbox</h1>
          </div>
        </div>
        <button id="sign-out" class="quiet-button hidden" type="button">Sign out</button>
      </header>

      <section id="login-panel" class="panel login-panel">
        <p class="eyebrow">DOCTOR ACCESS</p>
        <h2>Sign in to your inbox</h2>
        <p class="muted">Enter the access code provided by your administrator.</p>
        <form id="login-form">
          <label for="access-code">Access code</label>
          <input id="access-code" name="access-code" type="password" autocomplete="current-password" required>
          <button class="primary-button" type="submit">Sign in</button>
        </form>
        <p id="login-error" class="error-message" role="alert"></p>
      </section>

      <section id="inbox-panel" class="hidden">
        <div class="welcome-row">
          <div>
            <p class="eyebrow">POST-DISCHARGE MONITOR</p>
            <h2>Patient alerts</h2>
          </div>
          <button id="enable-push" class="primary-button push-button" type="button">Enable phone alerts</button>
        </div>
        <p id="status-message" class="status-message" role="status"></p>
        <p id="new-alert-banner" class="new-alert-banner hidden" role="alert"></p>
        <div class="summary-row">
          <div class="summary-card"><span>Needs attention</span><strong id="open-count">0</strong></div>
          <div class="summary-card"><span>Total alerts</span><strong id="total-count">0</strong></div>
        </div>
        <div id="alerts" class="alert-list" aria-live="polite"></div>
      </section>

      <footer>Clinical decision-support demo only. Not for emergency use or real patient data.</footer>
    </main>
    <script src="./app.js" defer></script>
  </body>
</html>
